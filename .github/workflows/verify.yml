name: Verify Kaguya assets
on:
  push:
    # Documentation and frozen downloads do not change animation/runtime.
    # Packaging has its own source/archive check; do not rerun artwork QA.
    paths:
      - 'candidates/phase5/**'
      - 'sources/**'
      - 'tools/**'
      - '!tools/build_native_packages.py'
      - 'viewer/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      full_audit:
        description: 'Explicit release audit: historical/trial rebuilds and installer regression'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  current-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Read current pixels and native contracts without regenerating artwork
        run: python tools/verify_fast.py
      - name: Core playback, cel replacement, interruption and adopted wave boundaries
        run: node --test tests/clock.test.mjs tests/candidate-clock.test.mjs tests/cel-painter.test.mjs tests/interaction-clock.test.mjs tests/wave-amplitude-contract.test.mjs tests/whole-review-clock.test.mjs
      - run: node --check viewer/candidate.mjs
      - run: node --check viewer/interaction.mjs
      - run: node --check viewer/whole-review.mjs
  release-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.full_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - name: Optional complete current and historical experiment reconstruction
        run: python tools/verify_review_rebuild.py
      - name: Optional Phase 3 historical pixel reconstruction
        run: |
          python tools/build.py --historical-phase3 --out work/rebuild
          python -c "from PIL import Image,ImageChops; a=Image.open('pet/spritesheet.webp').convert('RGBA'); b=Image.open('work/rebuild/spritesheet.webp').convert('RGBA'); assert a.tobytes()==b.tobytes()"
  installer-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.full_audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tools/test_install.ps1

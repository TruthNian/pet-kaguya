name: Verify Kaguya assets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/clock.test.mjs tests/review.test.mjs
      - name: Rebuild static identity review candidates
        run: |
          python tools/identity.py
          git diff --exit-code -- candidates/phase4/static
      - name: Rebuild shared-coordinate mother-pose review
        run: |
          python tools/review_jaw.py
          git diff --exit-code -- candidates/phase4/canonical-v3
      - name: Rebuild and compare decoded pixels
        run: |
          python tools/build.py --out work/rebuild
          python -c "from PIL import Image,ImageChops; a=Image.open('pet/spritesheet.webp').convert('RGBA'); b=Image.open('work/rebuild/spritesheet.webp').convert('RGBA'); assert a.tobytes()==b.tobytes()"
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tools/test_install.ps1

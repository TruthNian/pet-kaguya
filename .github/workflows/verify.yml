name: Verify Kaguya assets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/clock.test.mjs tests/review.test.mjs tests/idle-clock.test.mjs tests/candidate-clock.test.mjs tests/gaze-frame.test.mjs tests/cel-painter.test.mjs tests/comparison-reference.test.mjs tests/sampling-contract.test.mjs tests/interaction-clock.test.mjs tests/height-contract.test.mjs tests/material-support-contract.test.mjs tests/review-overlap-contract.test.mjs tests/cloth-follow-contract.test.mjs
      - run: node --check viewer/candidate.mjs
      - run: node --check viewer/interaction.mjs
      - name: Compare all decoded review pixels and metadata across rebuild
        run: python tools/verify_review_rebuild.py
      - name: Rebuild and compare decoded pixels
        run: |
          python tools/build.py --historical-phase3 --out work/rebuild
          python -c "from PIL import Image,ImageChops; a=Image.open('pet/spritesheet.webp').convert('RGBA'); b=Image.open('work/rebuild/spritesheet.webp').convert('RGBA'); assert a.tobytes()==b.tobytes()"
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tools/test_install.ps1
